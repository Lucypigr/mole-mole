name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['game/site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # the repo is ~10 GB of raw assets; only the packed game is needed
      - uses: actions/checkout@v4
        with:
          sparse-checkout: game/site
          sparse-checkout-cone-mode: true
          filter: blob:none
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: game/site
      - id: deployment
        uses: actions/deploy-pages@v4
